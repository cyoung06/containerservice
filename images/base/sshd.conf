# The console's keys: a Secret volume, whose directory modes sshd's StrictModes refuses for
# AuthorizedKeysFile, so they're read by a command instead (still live as the Secret changes).
AuthorizedKeysCommand /usr/bin/cat /etc/containerservice/authorized_keys
AuthorizedKeysCommandUser nobody
AuthorizedKeysFile .ssh/authorized_keys
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
# No PAM: pam_loginuid can't work in a container. dev's password is "*" (no password, not locked).
UsePAM no
PrintMotd no
AllowAgentForwarding yes
AllowTcpForwarding yes
X11Forwarding no
